# Netlify builds and serves the site with its Next.js runtime
# (@netlify/plugin-nextjs, picked up automatically for a Next.js project).
# Cloudflare files (wrangler.jsonc, open-next.config.ts, scripts/cf-build.mjs)
# are left in place but unused here.

[build]
  # Generates the (Node) Prisma client, then `next build`.
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Netlify fails a build when a secret's value appears in the output. These
  # three are expected there and aren't secrets to browsers: Next writes the
  # Server Action key into its own server-only manifest, APP_URL is the site's
  # public address, and the Paystack public key is publishable by design.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_SERVER_ACTIONS_ENCRYPTION_KEY,APP_URL,PAYSTACK_PUBLIC_KEY"
  # Next's compiler cache keeps a snapshot of the build environment between
  # builds. It sits inside the build output folder but is never published to
  # the site, so a key found there isn't exposed.
  SECRETS_SCAN_OMIT_PATHS = ".next/cache/**"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The videos and posters are large and rarely change: let browsers keep them
# for a week. A replaced clip under the same name can take that long to show
# for a returning visitor, so give a replacement a new file name.
[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
